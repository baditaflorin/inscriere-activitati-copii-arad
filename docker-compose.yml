services:
  app:
    image: ghcr.io/baditaflorin/inscriere-activitati-copii-arad:0.1.0
    build:
      context: .
    environment:
      PORT: "8080"
      STATIC_DIR: /app/docs
      CATALOG_PATH: /app/data/catalog.json
      VERSION_FILE: /app/VERSION.md
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/app/pcarad-server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "26453:26453"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
